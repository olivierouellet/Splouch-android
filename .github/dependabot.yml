# Unlike the iOS twin, this app does have dependencies — Compose, AndroidX, coroutines,
# kotlinx-serialization and OkHttp — and they are all declared in one place,
# `gradle/libs.versions.toml`, which is what Dependabot reads. It also picks up the
# Gradle wrapper. An app that ships to a phone deserves to know when one of them moves;
# the catalog is the only file a bump has to touch, so the PRs stay reviewable.
#
# Monthly, not weekly: the Compose BOM and AGP move on their own calendar, and this is a
# one-maintainer repo where a weekly pile of version bumps is noise rather than
# information. CI runs `:core:test` **and** `:app:assembleDebug` on each of these PRs,
# which is most of the point of opening them: a catalog bump compiles or it doesn't, and
# only the second of those two finds out.
#
# Actions are a different matter: they run with a token against this repo, they are pinned
# by tag, and nothing here would notice a stale or yanked one until a workflow started
# failing. That entry watches `.github/workflows/ci.yml`.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "[Build]"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "[Build]"
    labels:
      - dependencies
